[package]
name = "simia-desktop"
version = "0.1.20"
edition = "2021"
description = "SIMIA desktop launcher: serves the SIMIA web UI locally, supervises llama.cpp and downloads models on demand."

[dependencies]
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
