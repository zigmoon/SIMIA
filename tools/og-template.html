<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>SIMIA — carte sociale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  /* Gabarit de la carte 1200x630 servie comme og:image.
     Rendu par navigateur puis recadre a 1200x630 exactement :
     la taille doit rester stricte, les plateformes refusent les autres ratios. */
  html,body{margin:0;padding:0}
  body{
    width:1200px; height:630px; overflow:hidden;
    background:#f6f5f1; color:#1d2522;
    font-family:Manrope,"Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    position:relative;
  }
  .grain{
    position:absolute; inset:0;
    background:
      radial-gradient(760px 420px at 88% 8%, rgba(216,244,81,.35), transparent 62%),
      radial-gradient(620px 480px at 4% 96%, rgba(155,183,108,.18), transparent 66%);
  }
  .frame{position:absolute; inset:0; padding:64px 72px; display:flex; flex-direction:column}
  .top{display:flex; align-items:center; gap:16px}
  .mark{
    width:62px; height:62px; border-radius:16px; background:#1d2522; color:#d8f451;
    display:grid; place-items:center; font-weight:800; font-size:33px; line-height:1;
  }
  .wordmark{font-weight:800; font-size:30px; letter-spacing:.16em}
  .tagline{margin-left:auto; font-family:"DM Mono",ui-monospace,monospace; font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:#8b938d}
  h1{margin:44px 0 0; font-size:78px; line-height:1.02; letter-spacing:-.035em; font-weight:800; max-width:820px}
  h1 em{font-style:normal; box-shadow:inset 0 -.34em 0 #d8f451}
  .sub{margin:20px 0 0; font-size:23px; line-height:1.42; color:#5d675f; max-width:760px; font-weight:500}
  .foot{margin-top:auto; display:flex; align-items:center; gap:12px; flex-wrap:nowrap}
  .chip{
    font-family:"DM Mono",ui-monospace,monospace; font-size:13.5px; letter-spacing:.06em;
    padding:10px 15px; border:1px solid #d5d9d2; border-radius:999px; background:#fffefa; color:#2f3a2c;
  }
  .url{margin-left:auto; font-family:"DM Mono",ui-monospace,monospace; font-size:15px; letter-spacing:.04em; color:#1d2522}
  .url b{color:#4c6b1f}
</style>
</head>
<body>
  <div class="grain"></div>
  <div class="frame">
    <div class="top">
      <div class="mark">S</div>
      <div class="wordmark">SIMIA</div>
      <div class="tagline">Assistant IA local</div>
    </div>
    <h1>Votre IA, <em>chez vous</em>.</h1>
    <p class="sub">Conversation, documents et images calculés sur votre machine. Sans compte, sans serveur, sans télémétrie.</p>
    <div class="foot">
      <span class="chip">Windows</span>
      <span class="chip">macOS</span>
      <span class="chip">Linux</span>
      <span class="chip">Web</span>
      <span class="url">app.zigmoon.com<b>/SIMIA</b></span>
    </div>
  </div>
</body>
</html>
