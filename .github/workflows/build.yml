name: build

# Compile le lanceur pour les trois systemes et assemble un paquet pret a telecharger.
# Les binaires llama.cpp et stable-diffusion.cpp viennent de leurs releases :
# aucun compilateur C++ n'est necessaire.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Mise a jour : https://github.com/ggml-org/llama.cpp/releases
  LLAMA_TAG: b12413
  # Mise a jour : https://github.com/leejet/stable-diffusion.cpp/releases
  SD_RELEASE_TAG: master-1104-5dcfa79
  # `launcher/rust-toolchain.toml` impose la toolchain GNU de Windows pour les
  # builds locaux sans MSVC. Cette variable la neutralise : les runners macOS et
  # Linux utilisent leur toolchain native.
  RUSTUP_TOOLCHAIN: stable
  # Un modele d'image est joint aux archives pour que la generation d'images
  # fonctionne des le premier lancement, sans second telechargement. SD 1.5 est
  # le plus gros qui tienne sous la limite de 2 Gio par fichier de GitHub
  # Releases : SDXL Turbo pese 3,67 Go et ne peut pas y entrer.
  # Poids versionnes hors depot (.gitignore), donc telecharges ici puis verifies.
  SD15_FILE: stable-diffusion-v1-5-pruned-emaonly-Q4_0.gguf
  SD15_URL: https://huggingface.co/second-state/stable-diffusion-v1-5-GGUF/resolve/main/stable-diffusion-v1-5-pruned-emaonly-Q4_0.gguf
  SD15_BYTES: "1566768416"
  SD15_SHA256: b8944e9fe0b69b36ae1b5bb0185b3a7b8ef14347fe0fa9af6c64c4829022261f

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-latest
            llama: llama-b12413-bin-win-vulkan-x64.zip
            sd: sd-master-5dcfa79-bin-win-vulkan-x64.zip
            archive: zip
          - target: macos-arm64
            # macOS 14 a ete retire de GitHub Actions le 2 novembre 2026 :
            # macos-15 est le premier label Apple Silicon encore servi.
            os: macos-15
            llama: llama-b12413-bin-macos-arm64.tar.gz
            sd: sd-master-5dcfa79-bin-Darwin-macOS-26.7.2-arm64.zip
            archive: tar.gz
          - target: macos-x64
            # macos-13 n'existe plus ; macos-15-intel est le label Intel actuel
            # (macos-15-large exigerait un plan payant).
            os: macos-15-intel
            llama: llama-b12413-bin-macos-x64.tar.gz
            # L'archive amont de stable-diffusion.cpp pour macOS est universelle
            # (tranches arm64 et x86_64), mais les deux exigent macOS 26 et le
            # projet ne publie pas d'archive Intel distincte. La quasi-totalite
            # des Mac Intel tournent sous macOS 13 a 15 : le moteur serait
            # present sans pouvoir demarrer. On ne joint donc ni moteur ni
            # modele d'image, et l'archive pese 32 Mo au lieu de 1,4 Go.
            sd: ""
            archive: tar.gz
          - target: linux-x64
            # 22.04 et non 24.04 : la glibc liee est celle du runner, et le
            # lanceur compile sur 24.04 exigeait GLIBC_2.39, donc refusait de
            # demarrer sur Ubuntu 22.04 LTS. Les moteurs, eux, viennent de
            # binaires amont precompiles : llama-server demande 2.34 (compatible)
            # et sd-server 2.38 (24.04+), ce qui ne bloque que la generation
            # d'images. Conversation et atelier de code fonctionnent des 22.04.
            os: ubuntu-22.04
            llama: llama-b12413-bin-ubuntu-vulkan-x64.tar.gz
            sd: sd-master-5dcfa79-bin-Linux-Ubuntu-26.04-x86_64-vulkan.zip
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Verifier la presence de l'interface
        shell: bash
        run: |
          # Une installation PWA invalide passerait inapercue : on bloque ici.
          manquants=""
          for f in web/index.html web/app.js web/service-worker.js \
                   web/manifest.webmanifest web/offline.html \
                   web/icons/icon-192.png web/icons/icon-512.png; do
            [ -f "$f" ] || manquants="$manquants $f"
          done
          if [ -n "$manquants" ]; then
            echo "::error::Fichiers absents :$manquants — lancez tools/sync-web.ps1 puis commitez web/."
            exit 1
          fi
          python3 - <<'PY'
          import json, sys
          m = json.load(open("web/manifest.webmanifest", encoding="utf-8"))
          sizes = {i.get("sizes") for i in m.get("icons", [])}
          if not {"192x192", "512x512"} <= sizes:
            sys.exit("manifeste : icones 192 et 512 obligatoires")
          if m.get("display") != "standalone":
            sys.exit("manifeste : display doit valoir standalone")
          print("manifeste valide :", m["name"])
          PY

      - name: Outils Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher

      - name: Compiler le lanceur
        working-directory: launcher
        run: cargo build --release --locked

      # Signature Azure Trusted Signing, avant l'assemblage : le fichier copie
      # dans le paquet conserve sa signature, il n'y a donc rien a signer plus
      # tard ni a re-zipper. L'etape est sautee quand les variables de depot sont
      # vides, pour qu'un fork ou une pull request compilent sans compte Azure.
      #
      # Mise en place, une seule fois :
      #   1. compte Azure + « Trusted Signing » + verification d'identite de
      #      l'editeur (Zigmoon) chez Microsoft ;
      #   2. un « certificate profile » de type PublicTrust dans ce compte ;
      #   3. une application Entra avec le role « Trusted Signing Certificate
      #      Profile Reader » sur le compte de signature ;
      #   4. variables de depot AZURE_TS_ENDPOINT, AZURE_TS_ACCOUNT,
      #      AZURE_TS_PROFILE ; secrets AZURE_TENANT_ID, AZURE_CLIENT_ID,
      #      AZURE_CLIENT_SECRET.
      # Sans tout cela, l'archive part non signee, comme avant.
      #
      # Quand la signature devient active, trois textes doivent changer, sinon
      # l'archive annonce un avertissement qui n'existe plus : le haut de
      # packaging/LISEZ-MOI.txt, la section « Installer » de
      # tools/release-body.mjs, et la carte Windows de deploy/index.html.
      - name: Signer le lanceur (Windows)
        if: matrix.target == 'windows-x64' && vars.AZURE_TS_ACCOUNT != ''
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_TS_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_TS_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_TS_PROFILE }}
          files-folder: ${{ github.workspace }}/launcher/target/release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Une signature annoncee mais absente serait pire que pas de signature :
      # l'utilisateur croirait l'avertissement supprime alors qu'il reste. On
      # verifie donc le fichier lui-meme, pas le journal de l'etape precedente.
      - name: Verifier la signature Windows
        if: matrix.target == 'windows-x64' && vars.AZURE_TS_ACCOUNT != ''
        shell: pwsh
        run: |
          $exe = "launcher/target/release/simia-desktop.exe"
          if (-not (Test-Path $exe)) { throw "$exe introuvable" }
          $sig = Get-AuthenticodeSignature $exe
          if ($sig.Status -ne "Valid") {
            throw "signature $($sig.Status) sur $exe : l'archive ne doit pas partir ainsi"
          }
          "signe par : $($sig.SignerCertificate.Subject)"
          "horodatage : $($sig.TimeStamperCertificate.Subject)"

      - name: Recuperer les moteurs
        shell: bash
        env:
          LLAMA_ASSET: ${{ matrix.llama }}
          SD_ASSET: ${{ matrix.sd }}
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/sidecars"
          mkdir -p "$tmp" "vendor/llama/${{ matrix.target }}" "vendor/sd/${{ matrix.target }}"

          # Le fichier garde son extension d'origine : le decompresseur choisit
          # d'apres elle. Nomme "llama.pkg", rien n'etait extrait et le paquet
          # partait sans moteur.
          llama_pkg="$tmp/$LLAMA_ASSET"
          curl -fsSL -o "$llama_pkg" \
            "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_TAG}/${LLAMA_ASSET}"

          sd_pkg=""
          if [ -n "${SD_ASSET}" ]; then
            sd_pkg="$tmp/$SD_ASSET"
            curl -fsSL -o "$sd_pkg" \
              "https://github.com/leejet/stable-diffusion.cpp/releases/download/${SD_RELEASE_TAG}/${SD_ASSET}"
          fi

          extract() {
            case "$1" in
              *.zip) unzip -q -o "$1" -d "$2" ;;
              *.tar.gz) tar -xzf "$1" -C "$2" ;;
              *)
                echo "::error::archive non reconnue : $1"
                exit 1
                ;;
            esac
          }

          extract "$llama_pkg" "vendor/llama/${{ matrix.target }}"
          if [ -n "$sd_pkg" ]; then
            extract "$sd_pkg" "vendor/sd/${{ matrix.target }}"
          fi

          echo "--- moteurs presents ---"
          find vendor -type f \( -name "llama-server*" -o -name "sd-server*" \) | sort

          # Sans ce controle, un paquet sans moteur partait en release et le
          # lanceur echouait chez l'utilisateur, pas ici.
          # On passe par un fichier : « find | grep -q » peut echouer a tort
          # (grep sort au premier resultat, find recoit SIGPIPE, pipefail
          # propage le code 141).
          find vendor -type f -name "llama-server*" > "$tmp/llama-found.txt"
          if [ ! -s "$tmp/llama-found.txt" ]; then
            echo "::error::llama-server absent apres extraction"
            exit 1
          fi
          echo "llama-server : $(head -n 1 "$tmp/llama-found.txt")"

          if [ -n "${SD_ASSET}" ]; then
            find vendor -type f -name "sd-server*" > "$tmp/sd-found.txt"
            if [ ! -s "$tmp/sd-found.txt" ]; then
              echo "::error::sd-server absent apres extraction"
              exit 1
            fi
            echo "sd-server    : $(head -n 1 "$tmp/sd-found.txt")"
          fi

      - name: Assembler le paquet
        shell: bash
        run: |
          set -euo pipefail
          name="simia-${{ matrix.target }}"
          stage="$RUNNER_TEMP/$name"
          mkdir -p "$stage"

          binary="simia-desktop"
          if [ "${{ runner.os }}" = "Windows" ]; then binary="simia-desktop.exe"; fi
          cp "launcher/target/release/$binary" "$stage/"

          cp -r web "$stage/web"
          mkdir -p "$stage/models/image"
          cp models/catalog.json models/versions.json "$stage/models/"
          cp models/image/catalog.json "$stage/models/image/"

          # Le LoRA maison et le modele d'image pret a l'emploi ne sont joints
          # que sur les plateformes qui ont un moteur d'images. Mac Intel n'en a
          # pas : 6,4 Mo de LoRA et 1,46 Go de SD 1.5 y seraient inutilisables,
          # sans compter qu'un fichier .safetensors dans une archive sans moteur
          # laisse croire que la generation d'images est disponible.
          if [ -n "${{ matrix.sd }}" ]; then
            mkdir -p "$stage/models/image/loras"
            if ls models/image/loras/*.safetensors >/dev/null 2>&1; then
              cp models/image/loras/*.safetensors "$stage/models/image/loras/"
            fi
            dir="$stage/models/image/sd15"
            mkdir -p "$dir"
            curl -L --fail --retry 3 --retry-delay 5 --connect-timeout 30 \
              -o "$dir/$SD15_FILE" "$SD15_URL"
            size=$(wc -c < "$dir/$SD15_FILE" | tr -d ' ')
            if [ "$size" != "$SD15_BYTES" ]; then
              echo "::error::SD 1.5 : $size octets recus, $SD15_BYTES attendus"
              exit 1
            fi
            if command -v sha256sum >/dev/null 2>&1; then
              echo "$SD15_SHA256  $dir/$SD15_FILE" | sha256sum -c -
            else
              echo "$SD15_SHA256  $dir/$SD15_FILE" | shasum -a 256 -c -
            fi
            echo "modele d'image joint : $(du -h "$dir/$SD15_FILE" | cut -f1)"
          fi

          cp -r vendor "$stage/vendor"

          # Runtime MSVC app-local. Les archives officielles de llama.cpp ne
          # contiennent plus msvcp140.dll ni vcruntime140*.dll depuis b12413, et
          # simia-desktop.exe lui-meme importe VCRUNTIME140.dll : sans ces
          # fichiers, l'application ne demarre pas sur une machine sans le
          # redistribuable VC++. Ils sont donc versionnes dans runtime/msvc-x64/.
          if [ "${{ runner.os }}" = "Windows" ]; then
            runtime="runtime/msvc-x64"
            if ! ls "$runtime"/*.dll >/dev/null 2>&1; then
              echo "::error::runtime/msvc-x64/ ne contient aucune DLL"
              exit 1
            fi
            for dir in "$stage/vendor/llama/${{ matrix.target }}" "$stage/vendor/sd/${{ matrix.target }}"; do
              [ -d "$dir" ] || continue
              cp "$runtime"/*.dll "$dir/"
            done
            # Verification par la table d'import : un fichier manquant doit
            # faire echouer la compilation, pas l'utilisateur.
            for need in VCRUNTIME140.dll MSVCP140.dll VCRUNTIME140_1.dll MSVCP140_CODECVT_IDS.dll; do
              found=$(find "$stage/vendor" -maxdepth 4 -iname "$need" -print 2>/dev/null)
              if [ -z "$found" ]; then
                echo "::error::$need absent du paquet Windows"
                exit 1
              fi
            done
            echo "runtime MSVC : $(find "$stage/vendor" -iname 'vcruntime140*.dll' | wc -l) fichier(s) copie(s)"
          fi

          cp packaging/LISEZ-MOI.txt "$stage/LISEZ-MOI.txt"
          # Le meme fichier sert les quatre archives : le nom de la cible y est
          # injecte pour que le lecteur sache laquelle il a decompressee.
          # awk et non « sed -i » : le sed de macOS est BSD et exige une
          # extension de sauvegarde, donc « sed -i » y echoue.
          awk -v target="${{ matrix.target }}" '{ gsub(/\{\{TARGET\}\}/, target); print }' \
            packaging/LISEZ-MOI.txt > "$stage/LISEZ-MOI.txt"
          if grep -q "{{TARGET}}" "$stage/LISEZ-MOI.txt"; then
            echo "::error::le jeton de plateforme n'a pas ete remplace dans LISEZ-MOI.txt"
            exit 1
          fi

          # Dernier garde-fou : un paquet sans moteur ne doit jamais partir.
          found=$(find "$stage/vendor" -type f -name "llama-server*" -print 2>/dev/null)
          if [ -z "$found" ]; then
            echo "::error::le paquet assemble ne contient pas llama-server"
            exit 1
          fi
          echo "taille des moteurs : $(du -sh "$stage/vendor" | cut -f1)"

          # L'amont livre les deux scripts d'aide dans le meme dossier : celui
          # de l'autre systeme n'a aucun usage ici.
          if [ "${{ runner.os }}" = "Windows" ]; then
            find "$stage/vendor" -name "start-server.sh" -delete
          else
            find "$stage/vendor" -name "start-server.bat" -delete
          fi

          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd "$RUNNER_TEMP" && 7z a -tzip -mx=3 "$name.zip" "$name" > /dev/null)
            echo "archive=$RUNNER_TEMP/$name.zip" >> "$GITHUB_ENV"
            # Le dossier assemble reste sur place : l'installeur Windows le
            # reprend tel quel, sans redecompresser l'archive.
            echo "stage=$stage" >> "$GITHUB_ENV"
          else
            tar -czf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP" "$name"
            echo "archive=$RUNNER_TEMP/$name.tar.gz" >> "$GITHUB_ENV"
          fi

          du -sh "$RUNNER_TEMP/$name"

      # Installeur Windows : double-clic, raccourci, desinstalleur. Sans lui, le
      # visiteur doit decompresser 1,5 Go a la main avant meme de pouvoir
      # essayer SIMIA. Il est faculte par le meme dossier assemble que l'archive,
      # donc les deux contiennent exactement les memes fichiers.
      - name: Construire l'installeur Windows
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup absent de l'image : installation."
            choco install innosetup --no-progress -y | Out-Null
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe introuvable : impossible de construire l'installeur" }

          # Le tag porte un « v » : la version affichee dans Ajout/Suppression de
          # programmes ne doit pas le garder.
          $version = "${{ github.ref_name }}"
          if ($version.StartsWith("v")) { $version = $version.Substring(1) }
          if ($version -notmatch '^\d+\.\d+\.\d+') { $version = "0.0.0" }

          $source = $env:stage
          if (-not (Test-Path $source)) { throw "dossier assemble introuvable : $source" }

          & $iscc "/DAppVersion=$version" "/DSourceDir=$source" "/DOutputDir=$env:RUNNER_TEMP" "packaging\windows\simia.iss"
          if (-not $?) { throw "ISCC a echoue" }

          $setup = Join-Path $env:RUNNER_TEMP "simia-windows-x64-setup.exe"
          if (-not (Test-Path $setup)) { throw "installeur non produit" }

          # Un installeur vide passerait les controles precedents : on verifie
          # qu'il contient bien les quatre briques indispensables.
          $size = (Get-Item $setup).Length
          if ($size -lt 100MB) { throw "installeur suspect : $([math]::Round($size/1MB)) Mo" }
          "installeur : $([math]::Round($size/1MB)) Mo, version $version"
          "installer=$setup" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: simia-${{ matrix.target }}
          path: ${{ env.archive }}
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: matrix.target == 'windows-x64'
        with:
          name: simia-windows-installer
          path: ${{ env.installer }}
          retention-days: 14

  release:
    # `always()` : si une seule cible echoue, les autres paquets doivent quand
    # meme etre publies. Sans cela, un job macOS en echec annulerait aussi
    # Windows et Linux, deja compiles.
    if: always() && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      # Le checkout vient en premier : son `git clean -ffdx` efface les
      # fichiers ignores par git, donc `dist/`. Place apres le telechargement
      # des artefacts, il supprimait silencieusement les paquets et le job
      # echouait sur un `dist/` vide.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verifier qu'au moins un paquet existe
        shell: bash
        run: |
          set -euo pipefail
          count=$(find dist -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) | wc -l)
          echo "paquets trouves : $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::Aucune archive produite : rien a publier."
            exit 1
          fi
          ls -la dist

      # Les notes de release sont redigees a partir des archives reellement
      # presentes : tableau des telechargements, instructions d'installation
      # par systeme, empreintes SHA-256. Sans elles, GitHub n'affiche qu'un
      # « Full Changelog » automatique et le visiteur ne sait pas quoi faire.
      - name: Rediger les notes de version
        run: node tools/release-body.mjs

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          name: SIMIA ${{ github.ref_name }}
          body_path: release-body.md
          draft: false
          files: dist/*
          # Republier sur un tag deja utilise ecrase les archives existantes :
          # c'est ce qui permet de corriger une release defectueuse sans la
          # supprimer.
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Mettre a jour le tableau des versions du README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/update-readme-versions.mjs

      - name: Committer le README
        run: |
          if git diff --quiet -- README.md; then
            echo "README deja a jour."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: tableau des versions publiees [skip ci]"
          git push origin HEAD:main
